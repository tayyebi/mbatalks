server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json application/xml;

    # Keep directory redirects relative so the published URL never leaks the
    # container's internal port when running behind a reverse proxy.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'sha256-nvfcR/rTu7RYxJt8oq5oqFAp1n1DZUJ8WpumS8otJe4='; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Content-hashed filenames, so these can never go stale.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /search-index.json {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=86400" always; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=86400" always; }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
